[project]
name = "pixel-perfect"
version = "0.1.1"
description = "Restore AI-generated 'pixel art' into true, 100% pixel-perfect images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ventz Petkov" }]
keywords = ["pixel-art", "pixel-perfect", "image-processing", "downscaling", "ai-art", "gamedev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/ventz/pixel-perfect"
Repository = "https://github.com/ventz/pixel-perfect"
Documentation = "https://github.com/ventz/pixel-perfect/tree/main/docs"
Issues = "https://github.com/ventz/pixel-perfect/issues"

[project.scripts]
pixelperfect = "pixelperfect.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelperfect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
